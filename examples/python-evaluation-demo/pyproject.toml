[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "veyraeval-order-agent-demo"
version = "0.1.0"
description = "An independent Python agent demonstrating VeyraEval SDK integration"
requires-python = ">=3.11"
dependencies = ["veyraeval-sdk==0.1.1", "httpx==0.28.1"]

[project.scripts]
order-demo = "order_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
