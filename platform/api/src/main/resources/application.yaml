spring:
  application:
    name: agent-eval-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agenteval}
    username: ${DATABASE_USER:agenteval}
    password: ${DATABASE_PASSWORD:}
  session:
    jdbc:
      initialize-schema: never
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SECURE_COOKIES:true}
        same-site: lax
app:
  secure-cookies: ${SECURE_COOKIES:true}
  runner:
    enabled: ${RUNNER_ENABLED:false}
    base-url: ${RUNNER_BASE_URL:http://runner:8091}
    internal-key: ${RUNNER_INTERNAL_KEY:}
    image-digest: ${RUNNER_IMAGE_DIGEST:}
