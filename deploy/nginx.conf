worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    ssl_certificate /etc/agenteval/tls/server.crt;
    ssl_certificate_key /etc/agenteval/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server {
        listen 8443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location = /healthz { return 200 'ready'; add_header Content-Type text/plain; }
        location /api/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 75s;
            proxy_request_buffering on;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
    server {
        listen 9443 ssl;
        server_name _;
        client_max_body_size 101m;
        add_header X-Content-Type-Options nosniff always;
        location / {
            # SigV4 signs Host and path. Preserve both; never rewrite a /storage prefix.
            proxy_pass http://s3:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
    }
}
