name: Linux sandbox acceptance
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'runner/**'
      - 'e2e/**'
      - 'deploy/**'
      - 'platform/**'
      - 'sdks/**'
      - 'web/**'
      - 'contracts/**'
      - 'pom.xml'
      - 'scripts/**'
      - 'scripts/ci-install-runsc.sh'
      - '.github/workflows/sandbox-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardened-isolation:
    # Dedicated ephemeral VM, no pull_request trigger and no repository secrets.
    if: github.repository == '1993226871/veyraeval' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provision fixed hardened runtime on this disposable VM
        run: bash scripts/ci-install-runsc.sh
      - run: python -m pip install -r runner/requirements-test.lock
      - run: docker build --tag agent-eval-sandbox:acceptance runner/sandbox
      - name: Execute real runtime acceptance (no skip or fallback)
        shell: bash
        run: |
          export RUNNER_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' agent-eval-sandbox:acceptance)"
          python -m pytest runner/tests -q
          # A prior boundary probe returned NO_RESULT once. Repeat the actual
          # process/network/filesystem probe; any failure blocks acceptance.
          for attempt in $(seq 1 100); do
            python -m pytest runner/tests/integration/test_isolation.py -q -k network_filesystem_process_and_secret_boundaries
          done
      - name: Bounded runtime panic classification on failure
        if: failure()
        run: sudo find /tmp/agenteval-runsc-panic -maxdepth 1 -type f -exec grep -E -m 5 'newosproc|failed to create new OS thread|fatal error|panic:|resource temporarily unavailable' {} + || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Verify the real browser supplied by the dedicated VM image
        run: google-chrome --version
      - run: python -m pip install -r sdks/python/requirements-test.lock
      - name: Real Compose HTTPS, SDK, mixed evaluator and recovery acceptance
        shell: bash
        run: |
          export RUNNER_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' agent-eval-sandbox:acceptance)"
          export E2E_BROWSER_CHANNEL=chrome
          python -m pytest e2e -q -s -x
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-metrics
          path: |
            .tools/deployment-e2e/*/capacity-result.json
            .tools/deployment-e2e/*/restore-result.json
          if-no-files-found: ignore
