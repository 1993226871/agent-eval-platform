name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runner-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: runner/requirements-test.lock
      - run: python -m pip install -r runner/requirements-test.lock
      - run: python -m pytest runner/tests -m 'not integration' -q
      - run: docker build --tag agent-eval-sandbox:ci runner/sandbox
      - run: echo 'Control tests only. Hardened sandbox isolation is NOT VERIFIED by this job.'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sdks/python/requirements-test.lock
      - run: python -m pip install -r sdks/python/requirements-test.lock
      - run: python -m pytest sdks/python/tests -q
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r sdks/python/requirements-test.lock
      - run: python scripts/verify_phase_b.py
