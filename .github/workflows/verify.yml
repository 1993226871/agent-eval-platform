name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -p test_local_platform.py -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node ../scripts/build-openapi.mjs
      - run: npm run generate:api
      - run: git diff --exit-code -- ../contracts/openapi/platform-v1.yaml src/api/schema.ts
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run build
  runner-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: runner/requirements-test.lock
      - run: python -m pip install -r runner/requirements-test.lock
      - run: python -m pytest runner/tests -m 'not integration' -q
      - run: docker build --tag agent-eval-sandbox:ci runner/sandbox
      - run: echo 'Control tests only. Hardened sandbox isolation is NOT VERIFIED by this job.'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sdks/python/requirements-test.lock
      - run: python -m pip install -r sdks/python/requirements-test.lock
      - run: python -m pytest sdks/python/tests -q
      - run: python -m unittest discover -s scripts/tests -p test_stage_maven_bundle.py -v
      - run: python -m pip wheel --no-deps ./sdks/python --wheel-dir .tools/release
      - run: python scripts/verify_sdk_wheel.py .tools/release/veyraeval_sdk-0.1.1-py3-none-any.whl
      - name: Verify complete Python evaluation example against the built SDK
        run: |
          python -m pip install --no-deps .tools/release/veyraeval_sdk-0.1.1-py3-none-any.whl
          python -m unittest discover -s examples/python-evaluation-demo/tests -v
        env:
          PYTHONPATH: examples/python-evaluation-demo/src
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r sdks/python/requirements-test.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Verify real Chrome supplied by the VM image
        run: google-chrome --version
      - run: python scripts/verify_phase_b.py --web-smoke
        env:
          E2E_BROWSER_CHANNEL: chrome
